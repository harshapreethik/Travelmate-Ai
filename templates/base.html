<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TravelMate AI — Multilingual Tourist Assistant{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <!-- Top Navigation Header -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">
                <i class="bi bi-compass-fill text-primary me-2"></i><span data-i18n="app_title">TravelMate AI</span>
            </a>
            
            <div class="d-flex align-items-center gap-2">
                <!-- Global Language Switcher -->
                <label for="globalLangSelect" class="text-light small d-none d-sm-inline" data-i18n="lang_label">Language:</label>
                <select id="globalLangSelect" class="form-select form-select-sm" style="width: auto;">
                    {% for code, name in languages.items() %}
                        <option value="{{ code }}" {% if code == 'en' %}selected{% endif %}>{{ name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
    </nav>

    <!-- App Hero Banner -->
    <header class="hero-header text-center py-4 bg-light border-bottom mb-4">
        <div class="container">
            <h1 class="fw-bold display-6 mb-2" data-i18n="app_title">TravelMate AI</h1>
            <p class="lead mb-0 fs-6 text-secondary" data-i18n="hero_subtitle">Your Multilingual Companion for Instant Recommendations, Itineraries & Safety</p>
        </div>
    </header>

    <!-- Main Content Shell -->
    <main class="container mb-5">
        {% block content %}{% endblock %}
    </main>

    <!-- Bootstrap & Global JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/translations.js') }}"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
